[project]
name = "tareas"
version = "1.1.0"
description = "Automatiza tareas repetitivas con ficheros desde la terminal"
readme = "README.md"
authors = [
    { name = "Salva", email = "salllaiva@alu.edu.gva.com" }
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.13.6",
    "typer>=0.27.3",
]

[project.scripts]
tareas = "tareas.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
